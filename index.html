<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>🎵 Reproductor Clásico</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #1a0e47 100%);
      color: #fff;
      overflow: hidden;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    
    .navbar {
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 48px;
    }
    
    .navbar-title h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    
    .navbar-label {
      font-size: 9px;
      color: #1db954;
      font-weight: 700;
    }
    
    .btn-icon {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    .search-bar {
      padding: 0.5rem;
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .search-bar input {
      width: 100%;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    
    .search-bar input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    
    .now-playing {
      background: rgba(29, 185, 84, 0.08);
      border-bottom: 1px solid rgba(29, 185, 84, 0.2);
      padding: 0.8rem;
      text-align: center;
      flex-shrink: 0;
      height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    #viz {
      width: 100%;
      height: 40px;
      opacity: 0.8;
    }
    
    .now-playing h2 {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .now-playing p {
      font-size: 13px;
      color: #999;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .song-time {
      font-size: 12px;
      color: #1db954;
      font-weight: 700;
      margin-top: 0.2rem;
    }
    
    .progress {
      padding: 0.5rem;
      flex-shrink: 0;
      height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .progress-bar {
      background: rgba(255,255,255,0.1);
      height: 3px;
      border-radius: 2px;
      margin-bottom: 0.3rem;
      cursor: pointer;
      overflow: hidden;
    }
    
    .progress-bar-fill {
      background: #1db954;
      height: 100%;
      width: 0%;
    }
    
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
    }
    
    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      min-height: 0;
    }
    
    .playlist-title {
      font-size: 11px;
      color: #1db954;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }
    
    .song-item {
      padding: 0.8rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid transparent;
    }
    
    .song-item:active {
      background: rgba(255,255,255,0.1);
    }
    
    .song-item.playing {
      background: rgba(29, 185, 84, 0.2);
      border-left-color: #1db954;
    }
    
    .song-info {
      flex: 1;
      min-width: 0;
    }
    
    .song-title {
      font-size: 28px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      line-height: 1.2;
    }
    
    .song-artist {
      font-size: 24px;
      color: #999;
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .song-duration {
      font-size: 11px;
      color: #1db954;
      font-weight: 700;
      margin-left: 0.8rem;
      flex-shrink: 0;
    }
    
    .controls {
      background: rgba(0,0,0,0.6);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
      height: 52px;
      flex-wrap: nowrap;
    }
    
    .btn-control {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    #btn-play {
      background: #1db954;
      width: 48px;
      height: 48px;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(29, 185, 84, 0.4);
    }
    
    .volume-panel {
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem;
      display: none;
      flex-shrink: 0;
    }
    
    .volume-panel.show {
      display: block;
    }
    
    .volume-control {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 12px;
    }
    
    .volume-control input {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      -webkit-appearance: none;
    }
    
    .volume-control input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
    }
    
    .volume-control input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
      border: none;
    }
    
    .playlist::-webkit-scrollbar {
      width: 5px;
    }
    
    .playlist::-webkit-scrollbar-thumb {
      background: rgba(29, 185, 84, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div id="app">
  
  <div class="navbar">
    <div class="navbar-title">
      <div class="navbar-label">🎵 Clásicos</div>
      <h1>Reproductor</h1>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn-icon" id="btn-fav">❤️</button>
      <button class="btn-icon" id="btn-vol">🔊</button>
    </div>
  </div>
  
  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar canción...">
  </div>
  
  <div class="now-playing">
    <canvas id="viz" width="360" height="40"></canvas>
    <div>
      <h2 id="title">Cargando...</h2>
      <p id="artist">Conectando</p>
      <div class="song-time"><span id="duration">0:00</span></div>
    </div>
  </div>
  
  <div class="progress">
    <div class="progress-bar" id="progressBar">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="time-info">
      <span id="current">0:00</span>
      <span id="remaining">0:00</span>
    </div>
  </div>
  
  <div class="playlist" id="playlist"></div>
  
  <div class="controls">
    <button class="btn-control" id="btn-shuffle">🔀</button>
    <button class="btn-control" id="btn-prev">⏮️</button>
    <button class="btn-control" id="btn-play">▶️</button>
    <button class="btn-control" id="btn-next">⏭️</button>
    <button class="btn-control" id="btn-repeat">🔁</button>
  </div>
  
  <div class="volume-panel" id="volumePanel">
    <div class="volume-control">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="100" value="80">
      <span id="volValue">80%</span>
    </div>
  </div>

</div>

<script>
const player = {
  audio: null,
  audioCtx: null,
  gain: null,
  analyser: null,
  songs: [],
  current: 0,
  playing: false,
  repeat: 0,
  favorites: new Set(),
  showFav: false,
  filtered: []
};

const JSON_URL = "https://raw.githubusercontent.com/jchavezpe/reproductor/main/canciones.json";

async function init() {
  try {
    const res = await fetch(JSON_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    player.songs = data.canciones || [];
    player.filtered = [...player.songs];
    loadFav();
    updateList();
    if (player.songs.length > 0) loadTrack(0);
    console.log(`✅ ${player.songs.length} canciones cargadas`);
  } catch (e) {
    console.error('Error:', e);
    document.getElementById('title').textContent = 'Error cargando';
    document.getElementById('artist').textContent = 'Verifica tu conexión';
  }
}

function initAudio() {
  if (player.audioCtx) return;
  try {
    player.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    player.gain = player.audioCtx.createGain();
    player.analyser = player.audioCtx.createAnalyser();
    player.gain.connect(player.analyser);
    player.analyser.connect(player.audioCtx.destination);
    player.gain.gain.value = 0.8;
  } catch (e) {
    console.error('Audio context error:', e);
  }
}

function loadFav() {
  try {
    player.favorites = new Set(JSON.parse(localStorage.getItem('fav') || '[]'));
  } catch (e) {}
}

function saveFav() {
  localStorage.setItem('fav', JSON.stringify([...player.favorites]));
}

function loadTrack(i) {
  const songs = player.showFav ? player.filtered : player.songs;
  if (i < 0 || i >= songs.length) return;
  player.current = i;
  
  if (player.audio) player.audio.pause();
  
  const song = songs[i];
  player.audio = new Audio();
  player.audio.crossOrigin = "anonymous";
  player.audio.src = song.url;
  
  if (player.audioCtx) {
    try {
      const src = player.audioCtx.createMediaElementAudioSource(player.audio);
      src.connect(player.gain);
    } catch (e) {}
  }
  
  player.audio.addEventListener('ended', () => {
    if (player.repeat === 1) loadTrack(player.current);
    else if (player.current < songs.length - 1) {
      loadTrack(player.current + 1);
      play();
    }
  });
  
  player.audio.addEventListener('timeupdate', updateProgress);
  player.audio.addEventListener('loadedmetadata', () => {
    document.getElementById('remaining').textContent = '-' + fmt(player.audio.duration - player.audio.currentTime);
  });
  
  player.audio.addEventListener('error', (e) => {
    console.error('Audio error:', e);
  });
  
  updateDisplay();
}

function updateDisplay() {
  const songs = player.showFav ? player.filtered : player.songs;
  const s = songs[player.current];
  if (!s) return;
  
  document.getElementById('title').textContent = s.title;
  document.getElementById('artist').textContent = s.artist;
  document.getElementById('duration').textContent = fmt(s.duration);
  
  const isFav = player.favorites.has(s.url);
  document.getElementById('btn-fav').textContent = isFav ? '💔' : '❤️';
  
  updateList();
}

function updateList() {
  const songs = player.showFav ? player.filtered : player.songs;
  const html = songs.map((s, i) => `
    <div class="song-item ${i === player.current ? 'playing' : ''}" onclick="loadAndPlay(${i})">
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;">
        <div class="song-duration">${fmt(s.duration)}</div>
        <button onclick="event.stopPropagation(); toggleFav('${s.url}')" style="background: none; border: none; color: ${player.favorites.has(s.url) ? '#ed225d' : '#888'}; font-size: 13px; cursor: pointer; padding: 0; width: auto;">
          ${player.favorites.has(s.url) ? '💔' : '🤍'}
        </button>
      </div>
    </div>
  `).join('');
  
  document.getElementById('playlist').innerHTML = `<div class="playlist-title">${songs.length} canciones</div>` + html;
}

function toggleFav(url) {
  if (player.favorites.has(url)) player.favorites.delete(url);
  else player.favorites.add(url);
  saveFav();
  updateDisplay();
}

function updateProgress() {
  if (!player.audio) return;
  const pct = (player.audio.currentTime / player.audio.duration) * 100 || 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('current').textContent = fmt(player.audio.currentTime);
  document.getElementById('remaining').textContent = '-' + fmt(player.audio.duration - player.audio.currentTime);
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${ss.toString().padStart(2, '0')}`;
}

function play() {
  initAudio();
  if (!player.audio) loadTrack(player.current);
  player.audio.play().catch(e => console.error('Play error:', e));
  player.playing = true;
  document.getElementById('btn-play').textContent = '⏸️';
  drawViz();
}

function pause() {
  if (player.audio) player.audio.pause();
  player.playing = false;
  document.getElementById('btn-play').textContent = '▶️';
}

function drawViz() {
  const canvas = document.getElementById('viz');
  if (!canvas || !player.analyser || !player.playing) return;
  
  const ctx = canvas.getContext('2d');
  const len = player.analyser.frequencyBinCount;
  const data = new Uint8Array(len);
  player.analyser.getByteFrequencyData(data);
  
  ctx.fillStyle = 'rgba(15, 12, 41, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const w = (canvas.width / len) * 2.5;
  let x = 0;
  
  for (let i = 0; i < len; i++) {
    const h = (data[i] / 255) * canvas.height;
    ctx.fillStyle = `hsl(${(i/len)*120}, 100%, 50%)`;
    ctx.fillRect(x, canvas.height - h, w - 1, h);
    x += w;
  }
  
  requestAnimationFrame(drawViz);
}

function loadAndPlay(i) {
  loadTrack(i);
  setTimeout(() => play(), 50);
}

document.getElementById('btn-play').addEventListener('click', () => {
  player.playing ? pause() : play();
});

document.getElementById('btn-next').addEventListener('click', () => {
  const songs = player.showFav ? player.filtered : player.songs;
  if (player.current < songs.length - 1) {
    loadTrack(player.current + 1);
    if (player.playing) play();
  } else if (player.repeat === 1) {
    loadTrack(0);
    if (player.playing) play();
  }
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (player.audio && player.audio.currentTime > 3) {
    player.audio.currentTime = 0;
  } else {
    loadTrack(Math.max(0, player.current - 1));
    if (player.playing) play();
  }
});

document.getElementById('btn-repeat').addEventListener('click', () => {
  player.repeat = (player.repeat + 1) % 3;
  const emoji = ['🔁', '🔂', '🔃'];
  document.getElementById('btn-repeat').textContent = emoji[player.repeat];
});

document.getElementById('btn-fav').addEventListener('click', () => {
  const songs = player.showFav ? player.filtered : player.songs;
  const s = songs[player.current];
  if (s) toggleFav(s.url);
});

document.getElementById('btn-vol').addEventListener('click', () => {
  document.getElementById('volumePanel').classList.toggle('show');
});

document.getElementById('volume').addEventListener('input', (e) => {
  initAudio();
  player.gain.gain.value = e.target.value / 100;
  document.getElementById('volValue').textContent = e.target.value + '%';
});

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  player.filtered = !q ? [...player.songs] : player.songs.filter(s =>
    s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
  );
  player.current = 0;
  updateList();
  if (player.filtered.length > 0) loadTrack(0);
});

document.getElementById('progressBar').addEventListener('click', (e) => {
  if (!player.audio) return;
  const pct = e.offsetX / e.currentTarget.offsetWidth;
  player.audio.currentTime = pct * player.audio.duration;
});

// Mantener audio sonando cuando pantalla se bloquea
document.addEventListener('visibilitychange', () => {
  if (document.hidden && player.playing) {
    // Pantalla se bloqueó pero audio debe seguir
    console.log('Pantalla bloqueada - audio continúa en background');
  }
});

// Reintentar play si se pausa accidentalmente
setInterval(() => {
  if (player.playing && player.audio && player.audio.paused) {
    console.log('Reintentando reproducción...');
    player.audio.play().catch(e => console.error('Play retry error:', e));
  }
}, 1000);

window.addEventListener('load', init);
</script>

</body>
</html>
