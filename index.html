<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>🎵 Reproductor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #1a0e47 100%);
      color: #fff;
    }
    
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    
    /* NAVBAR - 50px fijo */
    .navbar {
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
      height: 50px;
    }
    
    .navbar-title {
      flex: 1;
      min-width: 0;
    }
    
    .navbar-label {
      font-size: 9px;
      color: #1db954;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .navbar h1 {
      font-size: 14px;
      margin: 0.2rem 0 0;
      font-weight: 700;
    }
    
    .button-group {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    
    button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    button:active {
      transform: scale(0.95);
    }
    
    /* SEARCH - 45px fijo */
    .search-bar {
      padding: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      height: 45px;
      display: flex;
      align-items: center;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    
    input[type="text"]::placeholder {
      color: rgba(255,255,255,0.5);
    }
    
    /* NOW PLAYING - 120px fijo */
    .now-playing {
      padding: 0.8rem;
      background: rgba(29, 185, 84, 0.05);
      border-bottom: 1px solid rgba(29, 185, 84, 0.2);
      text-align: center;
      flex-shrink: 0;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.4rem;
      overflow: hidden;
    }
    
    #visualizer {
      width: 100%;
      height: 45px;
      opacity: 0.8;
    }
    
    .now-playing h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .now-playing p {
      font-size: 12px;
      color: #b3b3b3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .now-playing-actions {
      margin-top: 0.3rem;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: nowrap;
    }
    
    .btn-small {
      background: rgba(29, 185, 84, 0.2);
      border: 1px solid #1db954;
      color: #1db954;
      padding: 0.3rem 0.6rem;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    /* PROGRESS - 45px fijo */
    .progress-section {
      padding: 0.6rem;
      background: rgba(0,0,0,0.2);
      flex-shrink: 0;
      height: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .progress-bar-container {
      background: rgba(255,255,255,0.1);
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    
    .progress-bar {
      background: linear-gradient(90deg, #1db954, #1ed760);
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    
    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #b3b3b3;
    }
    
    /* PLAYLIST - Lo que sobra */
    .playlist-section {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.6rem;
      min-height: 0;
    }
    
    .playlist-count {
      font-size: 11px;
      color: #1db954;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 0.8rem;
      font-weight: 700;
    }
    
    .playlist-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    
    .playlist-item {
      padding: 0.6rem;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    
    .playlist-item:active {
      background: rgba(255,255,255,0.1);
    }
    
    .playlist-item.current {
      background: rgba(29, 185, 84, 0.2);
      border-left-color: #1db954;
    }
    
    .song-info {
      flex: 1;
      min-width: 0;
    }
    
    .song-title {
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .song-artist {
      font-size: 11px;
      color: #888;
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .song-meta {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
    }
    
    .song-duration {
      color: #1db954;
      font-weight: 700;
      font-size: 11px;
    }
    
    /* CONTROLS - 55px fijo */
    .controls {
      background: rgba(0,0,0,0.6);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      height: 55px;
    }
    
    .btn-play {
      background: #1db954;
      border: none;
      color: #000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(29, 185, 84, 0.4);
      flex-shrink: 0;
    }
    
    .btn-play:active {
      transform: scale(0.92);
    }
    
    /* VOLUME - Oculto hasta que se abra */
    .volume-panel {
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem;
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      flex-shrink: 0;
      max-height: 70px;
    }
    
    .volume-panel.show {
      display: flex;
    }
    
    .volume-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    
    input[type="range"] {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
      border: none;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #1db954;
      font-size: 12px;
    }
    
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(29, 185, 84, 0.3);
      border-top-color: #1db954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .playlist-section::-webkit-scrollbar {
      width: 5px;
    }
    
    .playlist-section::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .playlist-section::-webkit-scrollbar-thumb {
      background: rgba(29, 185, 84, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <div class="navbar">
    <div class="navbar-title">
      <div class="navbar-label">🎵 Clásicos</div>
      <h1>Reproductor</h1>
    </div>
    <div class="button-group">
      <button id="btn-favorites-toggle">❤️</button>
      <button id="btn-settings">⚙️</button>
    </div>
  </div>
  
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar...">
  </div>
  
  <div class="now-playing">
    <canvas id="visualizer" width="320" height="45"></canvas>
    <h2 id="song-title">Cargando...</h2>
    <p id="song-artist">Conectando...</p>
    <div class="now-playing-actions">
      <button id="btn-add-favorite" class="btn-small">❤️</button>
      <span id="song-duration" style="font-size: 11px; color: #888;">0:00</span>
    </div>
  </div>
  
  <div class="progress-section">
    <div class="progress-bar-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="time-display">
      <span id="time-current">0:00</span>
      <span id="time-remaining">0:00</span>
    </div>
  </div>
  
  <div class="playlist-section">
    <div class="playlist-count">
      <div class="loading">
        <span class="spinner"></span>
        Cargando...
      </div>
    </div>
    <div class="playlist-list" id="queue-list"></div>
  </div>
  
  <div class="controls">
    <button id="btn-shuffle">🔀</button>
    <button id="btn-prev">⏮️</button>
    <button id="btn-play" class="btn-play">▶️</button>
    <button id="btn-next">⏭️</button>
    <button id="btn-repeat">🔁</button>
  </div>
  
  <div id="volume-panel" class="volume-panel">
    <div class="volume-control">
      <span>🔊</span>
      <input type="range" id="volume-slider" min="0" max="100" value="80">
      <span id="volume-value" style="font-size: 11px;">80%</span>
    </div>
  </div>

</div>

<script>
const player = {
  audio: null,
  audioContext: null,
  gainNode: null,
  compressor: null,
  analyser: null,
  songs: [],
  currentIndex: 0,
  isPlaying: false,
  repeatMode: 0,
  favorites: new Set(),
  showFavoritesOnly: false,
  filteredSongs: []
};

const GITHUB_JSON_URL = "https://raw.githubusercontent.com/jchavezpe/reproductor/main/canciones.json";

function initAudioContext() {
  if (!player.audioContext) {
    try {
      player.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      player.gainNode = player.audioContext.createGain();
      player.compressor = player.audioContext.createDynamicsCompressor();
      player.analyser = player.audioContext.createAnalyser();
      
      player.compressor.threshold.value = -24;
      player.compressor.knee.value = 30;
      player.compressor.ratio.value = 12;
      player.compressor.attack.value = 0.003;
      player.compressor.release.value = 0.25;
      
      player.compressor.connect(player.gainNode);
      player.gainNode.connect(player.analyser);
      player.analyser.connect(player.audioContext.destination);
      player.analyser.fftSize = 256;
    } catch (e) {
      console.error('Audio context error:', e);
    }
  }
  loadFavorites();
}

function loadFavorites() {
  try {
    const fav = localStorage.getItem('spotify-favorites');
    player.favorites = new Set(JSON.parse(fav || '[]'));
  } catch (e) {}
}

function saveFavorites() {
  localStorage.setItem('spotify-favorites', JSON.stringify([...player.favorites]));
}

async function loadSongsFromGitHub() {
  try {
    const response = await fetch(GITHUB_JSON_URL);
    if (!response.ok) throw new Error('Error loading JSON');
    
    const data = await response.json();
    player.songs = (data.canciones || []);
    player.filteredSongs = [...player.songs];
    
    console.log(`✅ ${player.songs.length} canciones`);
    
    if (player.songs.length > 0) {
      loadSong(0);
      updateQueueList();
    }
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('song-title').textContent = 'Error cargando';
  }
}

function createAudio(url) {
  const audio = new Audio();
  audio.crossOrigin = "anonymous";
  audio.src = url;
  
  try {
    const source = player.audioContext.createMediaElementAudioSource(audio);
    source.connect(player.compressor);
  } catch (e) {}
  
  return audio;
}

function drawVisualizer() {
  const canvas = document.getElementById('visualizer');
  if (!canvas || !player.analyser || !player.isPlaying) return;
  
  const ctx = canvas.getContext('2d');
  const bufferLength = player.analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  player.analyser.getByteFrequencyData(dataArray);
  
  ctx.fillStyle = 'rgba(15, 12, 41, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const barWidth = (canvas.width / bufferLength) * 2.5;
  let x = 0;
  
  for (let i = 0; i < bufferLength; i++) {
    const barHeight = (dataArray[i] / 255) * canvas.height;
    const hue = (i / bufferLength) * 120;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
    x += barWidth;
  }
  
  requestAnimationFrame(drawVisualizer);
}

function loadSong(index) {
  const songs = player.showFavoritesOnly ? player.filteredSongs : player.songs;
  if (index < 0 || index >= songs.length) return;
  player.currentIndex = index;
  
  if (player.audio) {
    player.audio.pause();
    player.audio = null;
  }
  
  const song = songs[index];
  player.audio = createAudio(song.url);
  player.audio.addEventListener('ended', nextSong);
  player.audio.addEventListener('timeupdate', updateProgress);
  player.audio.addEventListener('loadedmetadata', updateDuration);
  
  updateDisplay();
}

function updateDisplay() {
  const songs = player.showFavoritesOnly ? player.filteredSongs : player.songs;
  const song = songs[player.currentIndex];
  if (!song) return;
  
  document.getElementById('song-title').textContent = song.title || 'Desconocida';
  document.getElementById('song-artist').textContent = song.artist || 'Artista';
  document.getElementById('song-duration').textContent = song.duration ? formatTime(song.duration) : '0:00';
  
  const isFavorite = player.favorites.has(song.url);
  document.getElementById('btn-add-favorite').textContent = isFavorite ? '💔' : '❤️';
  
  updateQueueList();
}

function updateQueueList() {
  const songs = player.showFavoritesOnly ? player.filteredSongs : player.songs;
  document.querySelector('.playlist-count').innerHTML = `${songs.length} canciones`;
  
  const queueList = document.getElementById('queue-list');
  queueList.innerHTML = songs.map((song, i) => {
    const isCurrent = i === player.currentIndex;
    const isFav = player.favorites.has(song.url);
    return `
      <div onclick="loadAndPlay(${i})" class="playlist-item ${isCurrent ? 'current' : ''}">
        <div class="song-info">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
        <div class="song-meta">
          <div class="song-duration">${song.duration ? formatTime(song.duration) : '-'}</div>
          <button onclick="event.stopPropagation(); toggleFavorite('${song.url}', event)" style="background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; color: ${isFav ? '#ed225d' : '#888'};">
            ${isFav ? '💔' : '🤍'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function toggleFavorite(url, event) {
  if (player.favorites.has(url)) {
    player.favorites.delete(url);
  } else {
    player.favorites.add(url);
  }
  saveFavorites();
  updateQueueList();
  updateDisplay();
}

function updateProgress() {
  if (!player.audio) return;
  const progress = (player.audio.currentTime / player.audio.duration) * 100 || 0;
  document.getElementById('progress-bar').style.width = progress + '%';
  document.getElementById('time-current').textContent = formatTime(player.audio.currentTime);
  document.getElementById('time-remaining').textContent = '-' + formatTime(player.audio.duration - player.audio.currentTime);
}

function updateDuration() {
  if (player.audio) {
    document.getElementById('time-remaining').textContent = '-' + formatTime(player.audio.duration - player.audio.currentTime);
  }
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${ss.toString().padStart(2, '0')}`;
}

function playSong() {
  initAudioContext();
  if (!player.audio) loadSong(player.currentIndex);
  if (player.audio) {
    player.audio.play().catch(e => console.error('Play:', e));
    player.isPlaying = true;
    document.getElementById('btn-play').textContent = '⏸️';
    drawVisualizer();
  }
}

function pauseSong() {
  if (player.audio) player.audio.pause();
  player.isPlaying = false;
  document.getElementById('btn-play').textContent = '▶️';
}

function togglePlay() {
  player.isPlaying ? pauseSong() : playSong();
}

function nextSong() {
  const songs = player.showFavoritesOnly ? player.filteredSongs : player.songs;
  let next = player.currentIndex + 1;
  if (next >= songs.length) {
    next = player.repeatMode === 1 ? 0 : -1;
  }
  if (next >= 0) {
    loadSong(next);
    if (player.isPlaying) playSong();
  } else pauseSong();
}

function prevSong() {
  if (player.audio && player.audio.currentTime > 3) {
    player.audio.currentTime = 0;
  } else {
    loadSong(Math.max(0, player.currentIndex - 1));
    if (player.isPlaying) playSong();
  }
}

function loadAndPlay(idx) {
  loadSong(idx);
  setTimeout(() => playSong(), 50);
}

function toggleRepeat() {
  player.repeatMode = (player.repeatMode + 1) % 3;
  const emojis = ['🔁', '🔂', '🔃'];
  document.getElementById('btn-repeat').textContent = emojis[player.repeatMode];
}

// Events
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-next').addEventListener('click', nextSong);
document.getElementById('btn-prev').addEventListener('click', prevSong);
document.getElementById('btn-repeat').addEventListener('click', toggleRepeat);

document.getElementById('search-input').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  player.filteredSongs = !query ? [...player.songs] : player.songs.filter(s => 
    (s.title || '').toLowerCase().includes(query) || 
    (s.artist || '').toLowerCase().includes(query)
  );
  player.currentIndex = 0;
  if (player.filteredSongs.length > 0) loadSong(0);
  updateQueueList();
});

document.getElementById('btn-favorites-toggle').addEventListener('click', () => {
  player.showFavoritesOnly = !player.showFavoritesOnly;
  player.filteredSongs = player.showFavoritesOnly 
    ? player.songs.filter(s => player.favorites.has(s.url))
    : [...player.songs];
  document.getElementById('btn-favorites-toggle').style.color = player.showFavoritesOnly ? '#ed225d' : '#fff';
  player.currentIndex = 0;
  updateQueueList();
});

document.getElementById('volume-slider').addEventListener('input', (e) => {
  initAudioContext();
  player.gainNode.gain.value = e.target.value / 100;
  document.getElementById('volume-value').textContent = e.target.value + '%';
});

document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('volume-panel').classList.toggle('show');
});

document.getElementById('progress-container').addEventListener('click', (e) => {
  if (!player.audio) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  player.audio.currentTime = percent * player.audio.duration;
});

document.getElementById('btn-add-favorite').addEventListener('click', () => {
  const songs = player.showFavoritesOnly ? player.filteredSongs : player.songs;
  const song = songs[player.currentIndex];
  if (song) toggleFavorite(song.url);
});

window.addEventListener('load', () => {
  initAudioContext();
  loadSongsFromGitHub();
});
</script>

</body>
</html>
